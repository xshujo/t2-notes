<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="description" content="Private notes generator for CTWS" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="style.css" />
    <title>CTWS CA T2 Private Notes</title>
  </head>

  <body>
    <main>
      <!-- Version 3 -->
      <form id="form_version_3">
        <!-- SR NUMBER, PREFERRED CONTACT METHOD, PREFERRED LANGUAGE, ISSUE DESCRIPTION -->
        <ul id="ul__case-info">
          <!-- SR number -->
          <li>
            <input type="text" id="input__sr-number" placeholder="SR#" />
          </li>
          <!-- Preferred contact method -->
          <li>
            <span>&#9660;</span>
            <select id="select__contact-method">
              <option value="PHONE">PHONE</option>
              <option value="EMAIL">EMAIL</option>
            </select>
          </li>
          <!-- Preferred language -->
          <li>
            <span>&#9660;</span>
            <select id="select__language">
              <option value="" selected hidden disabled>Language</option>
              <option value="French">French</option>
              <option value="English">English</option>
              <option value="Bilingual">Bilingual (FR/EN)</option>
            </select>
          </li>
          <!-- Issue description -->
          <li>
            <input
              type="text"
              id="input__issue"
              placeholder="Issue description"
              autocomplete="off"
            />
          </li>
          <!-- WARRANTY STATUS, PURCHASE LOCATION, NUMBER OF REPAIRS, CURRENT RESOLUTION -->
          <!-- Warranty status -->
          <li>
            <span>&#9660;</span>
            <select id="select__warranty">
              <option value="" selected hidden disabled>Warranty status</option>
              <option value="oem">OEM warranty</option>
              <option value="costco">Costco's 2nd year</option>
              <option value="costco">Costco's 2nd year (grace period)</option>
              <option value="asurion">Excellence Plus</option>
              <option value="90 days">90 days return policy</option>
              <option value="oow">OOW</option>
            </select>
          </li>
          <!-- Purchase location -->
          <li>
            <span>&#9660;</span>
            <select id="select__purchase-location">
              <option value="" selected hidden disabled>
                Purchase location
              </option>
              <option value="894">894</option>
              <option value="WH#">WH#</option>
            </select>
            <input
              type="number"
              id="input__wh-number"
              placeholder="Warehouse #"
            />
          </li>
          <!-- Number of repairs -->
          <li>
            <input
              type="text"
              id="input__repairs"
              placeholder="Number of repairs/visits"
            />
          </li>
          <!-- Current resolution -->
          <li>
            <input
              type="text"
              id="input__resolution"
              placeholder="Current resolution"
            />
          </li>
        </ul>
        <!-- CURRENT CASE STATUS AND ACTIONS TAKEN -->
        <ul id="ul__status-actions">
          <!-- Current SR status -->
          <li>
            <textarea
              spellcheck="true"
              placeholder="Current SR status"
            ></textarea>
          </li>
          <!-- Actions taken -->
          <li>
            <textarea spellcheck="true" placeholder="Actions taken"></textarea>
          </li>
          <!-- New SR status -->
          <li>
            <textarea spellcheck="true" placeholder="New SR status"></textarea>
          </li>
        </ul>
        <!-- SIGNATURE -->
        <ul id="ul__signature">
          <p>Signature:</p>
          <li>
            <input
              type="text"
              placeholder="[1st Name(s)][Last Name(s) Initials][Region/City]CTWS"
            />
          </li>
        </ul>
        <!-- SCATTERED NOTES -->
        <ul id="ul__scattered-notes">
          <li>
            <textarea
              spellcheck="true"
              placeholder="Scattered notes (these won't appear in the results)"
            ></textarea>
          </li>
        </ul>
      </form>
      <!-- RESULTS -->
      <section id="section__result">
        <!-- Exclude SR info option -->
        <div id="div__status-actions-only">
          <input type="checkbox" id="input__status-actions-only" />
          <label for="input__status-actions-only">Exclude case info</label>
        </div>
        <!-- Copy button -->
        <button id="button__copy" type="button">Copy</button>
        <!-- Clear button -->
        <button type="button" id="button__clear">Clear</button>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
